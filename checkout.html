<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thank you for your interest · Gleev</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#17245F">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="stylesheet" href="css/styles.css">
<script>document.documentElement.classList.add('js')</script>
</head>
<body>
<div class="co-page">
  <header class="co-head">
    <a class="brand" href="index.html" aria-label="Back to Gleev"><img class="brand-mark" src="assets/logo.svg" alt="" width="26" height="26"><span class="brand-word">GLEEV</span></a>
    <a href="index.html" class="secure">← BACK TO SITE</a>
  </header>

  <main class="waitlist is-on" id="waitlist" aria-live="polite">
    <div id="wl-form-view" class="wl-view">
      <h1>Thank you for your interest in Gleev.</h1>
      <p>Gleev isn't available just yet, and nothing has been charged. Leave your email and we'll let you know as soon as it's ready.</p>
      <div class="wl-plan" id="wl-plan-box">
        <span class="eyebrow">YOUR SELECTION</span>
        <b id="wl-plan-name"></b>
        <span id="wl-plan-price"></span>
      </div>
      <form id="wl-form" data-klaviyo-form data-source="checkout_waitlist" novalidate>
        <label class="fld">Email address<input type="email" name="email" id="wl-email" inputmode="email" autocomplete="email" placeholder="you@example.com" required></label>
        <label class="consent"><input type="checkbox" name="consent" required><span>I agree to receive an email when Gleev is available. I can unsubscribe at any time. See the <a href="legal/privacy.html"><u>privacy policy</u></a>.</span></label>
        <input class="hp" type="text" name="company" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button class="btn" type="submit">Notify me</button>
        <p class="form-msg" role="status" aria-live="polite"></p>
      </form>
    </div>
    <div id="wl-done" class="wl-view" style="display:none">
      <div class="tick" aria-hidden="true">✓</div>
      <h1 tabindex="-1">You're on the list.</h1>
      <p>Thanks! We'll email <b id="wl-done-email"></b> as soon as Gleev is available.</p>
      <a class="btn btn-inline" href="index.html">Back to Gleev</a>
    </div>
  </main>
</div>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/klaviyo.js"></script>
<script src="js/cart.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
